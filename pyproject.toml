[project]
name = "drone-gcs"
version = "0.1.0"
description = "Multi-UAV AI Drone Ground Control Station (Web-GCS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.5",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pymavlink>=2.4.50",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
link-mode = "copy"

[tool.ruff]
# 보일러플레이트, 테스트 픽스처 및 문서 폴더 자동 수정 방지
exclude = [
    ".git",
    ".agents",
    "docs",
    "templates",
    "tests",
]

[tool.ruff.lint]
# re-export 인터페이스 임의 삭제 원천 차단
unfixable = ["F401"]

