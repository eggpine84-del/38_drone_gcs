[project]
name = "drone-gcs"
version = "0.1.0"
description = "Multi-UAV AI Drone Ground Control Station (Web-GCS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.5",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
link-mode = "copy"

