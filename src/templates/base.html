<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}DRONE-GCS 전술 관제탑{% endblock %}</title>
  <!-- Tailwind CSS 공식 CDN (버전 명시) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX 공식 CDN (1.9.10 버전 고정) -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="min-h-[100dvh] w-full max-w-full overflow-x-hidden bg-slate-950 text-slate-100 font-sans antialiased pb-24 pb-[calc(6rem+env(safe-area-inset-bottom))]">

  <!-- P-5 메인 키 비주얼 고화질 백드롭 (순수 Tailwind 블렌딩) -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <img src="/static/images/drone_gcs_hero.jpg" alt="관제 백드롭" class="w-full h-full object-cover opacity-50 contrast-110">
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/70 to-slate-950/40"></div>
  </div>

  <!-- 메인 인터페이스 레이어 -->
  <div class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
