<!-- 
  [View] 엑셀/CSV 드롭존 및 다운로드 뷰
  - htmx를 통한 파일 비동기 전송
-->
<div class="p-6 bg-slate-900 border border-slate-800 rounded-xl space-y-4">
    <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-100">데이터 대량 연동 (엑셀/CSV)</h3>
        <a href="/sample-excel/download"
           class="px-3 py-1.5 text-xs font-semibold text-slate-200 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg flex items-center gap-2">
            다운로드
        </a>
    </div>

    <!-- 파일 업로드 폼 -->
    <form hx-post="/sample-excel/upload"
          hx-target="#upload-result"
          hx-encoding="multipart/form-data"
          class="p-6 border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl flex flex-col items-center justify-center gap-3 transition-colors">
        <input type="file" name="file" accept=".csv" required class="text-xs text-slate-400" />
        <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg">
            대량 데이터 업로드 시작
        </button>
    </form>

    <div id="upload-result"></div>
</div>
