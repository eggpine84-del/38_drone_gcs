<!-- 
  [View] 감사 로그 타임라인 뷰
-->
<div class="p-6 bg-slate-900 border border-slate-800 rounded-xl space-y-4">
    <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-slate-100">시스템 감사 및 변경 이력 로그</h3>
        <button hx-get="/sample-audit"
                hx-target="#audit-log-body"
                class="px-2.5 py-1 text-xs text-slate-300 hover:text-white bg-slate-800 rounded border border-slate-700">
            새로고침
        </button>
    </div>

    <div class="overflow-x-auto rounded-lg border border-slate-800">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-800/60 text-slate-400 text-xs font-semibold uppercase border-b border-slate-700">
                    <th class="p-3 w-36">일시</th>
                    <th class="p-3 w-48">작업자</th>
                    <th class="p-3 w-24">유형</th>
                    <th class="p-3">대상</th>
                    <th class="p-3">변경 내역 (Diff)</th>
                </tr>
            </thead>
            <tbody id="audit-log-body" hx-get="/sample-audit" hx-trigger="load">
                <!-- 감사 로그 조각 렌더링 -->
            </tbody>
        </table>
    </div>
</div>
