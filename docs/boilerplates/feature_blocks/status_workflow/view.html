<!-- 
  [View] 상태 전이 워크플로우 뷰 조각
  - 상태 클릭 시 즉시 htmx로 상태 배지 교체
-->
<div class="p-6 bg-slate-900 border border-slate-800 rounded-xl space-y-4">
    <h3 class="text-base font-bold text-slate-100">주문 승인 워크플로우 샘플</h3>
    
    <div class="flex items-center justify-between p-4 bg-slate-800/60 rounded-lg border border-slate-700">
        <div>
            <div class="text-sm font-semibold text-slate-200">주문 #ORD-2026-9901</div>
            <div class="text-xs text-slate-400">클라이언트: (주)에이비씨</div>
        </div>

        <div class="flex items-center gap-3">
            <span id="order-status-9901" class="px-2.5 py-1 text-xs rounded-full border bg-amber-500/10 text-amber-400 border-amber-500/20">
                RECEIVED
            </span>

            <form hx-post="/sample-workflow/9901/transition"
                  hx-target="#order-status-9901"
                  hx-swap="outerHTML"
                  class="flex items-center gap-2">
                <input type="hidden" name="current_status" value="RECEIVED" />
                <button type="submit" name="target_status" value="APPROVED"
                        class="px-2.5 py-1 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded">
                    승인하기
                </button>
                <button type="submit" name="target_status" value="CANCELLED"
                        class="px-2.5 py-1 text-xs font-semibold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 rounded">
                    반려
                </button>
            </form>
        </div>
    </div>
</div>
