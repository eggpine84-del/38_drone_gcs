<!-- 
  [Boilerplate View] 표준 B2B CRUD 테이블 & 인라인 폼 뷰
  - htmx 기반 노션 스타일 무중단 부분 교체
  - 1em 단색 SVG 버튼 준수
  - 토스트 알림 연동
-->
<div class="p-6 bg-slate-900 border border-slate-800 rounded-xl space-y-6">
    <!-- 상단 헤더 & 컨트롤러 -->
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-lg font-bold text-slate-100">표준 데이터 관리 견본</h2>
            <p class="text-xs text-slate-400 mt-1">htmx 인라인 편집 및 원장 보호(Soft Delete)가 적용된 보일러플레이트입니다.</p>
        </div>
        <!-- 글로벌 토스트 메시지 영역 (hx-swap-oob 대상) -->
        <div id="toast" class="transition-all duration-300"></div>
    </div>

    <!-- 신규 등록 인라인 폼 -->
    <form hx-post="/sample-items"
          hx-target="#item-table-body"
          hx-swap="beforeend"
          hx-on::after-request="if(event.detail.successful) this.reset()"
          class="flex items-center gap-3 p-4 bg-slate-800/40 rounded-lg border border-slate-700/60">
        <input type="text"
               name="name"
               placeholder="항목 이름을 입력하세요 (필수 2자 이상)"
               required
               class="flex-1 px-3 py-2 text-sm bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />
        
        <input type="text"
               name="category"
               placeholder="카테고리"
               class="w-40 px-3 py-2 text-sm bg-slate-900 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />

        <button type="submit"
                hx-disabled-elt="this"
                class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition-colors flex items-center gap-2">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
            </svg>
            항목 추가
        </button>
    </form>

    <!-- 테이블 영역 -->
    <div class="overflow-x-auto rounded-lg border border-slate-800">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-800/60 text-slate-400 text-xs font-semibold uppercase tracking-wider border-b border-slate-700/80">
                    <th class="p-3 w-16">ID</th>
                    <th class="p-3">항목명</th>
                    <th class="p-3 w-32">카테고리</th>
                    <th class="p-3 w-28">상태</th>
                    <th class="p-3 w-36 text-right">관리</th>
                </tr>
            </thead>
            <tbody id="item-table-body"
                   hx-get="/sample-items"
                   hx-trigger="load"
                   class="divide-y divide-slate-800">
                <!-- 페이지 첫 로드 시 /sample-items 가 호출되어 tr 조각들이 여기에 렌더링됩니다 -->
            </tbody>
        </table>
    </div>
</div>
